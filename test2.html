<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Wave UI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    color: white;
}



/* Wave Containers */
.wave-container {
    position: absolute;
    width: 100%;
    overflow: hidden;
    line-height: 0;
}

.wave-container svg {
    display: block;
    width: 100%;
    height: 200px;
}

/* Bottom wave container */
.wave-container.bottom {
    bottom: 0;
    left: 0;
}

/* Top wave container - rotated */
.wave-container.top {
    top: 0;
    left: 0;
    transform: rotate(180deg);
}

/* Waves */
.wave1 {
    fill: rgba(255, 255, 255, 0.15);
}

.wave2 {
    fill: rgba(255, 255, 255, 0.08);
}

.wave3 {
    fill: rgba(255, 255, 255, 0.05);
}

/* Responsive adjustments */
@media (max-width: 768px) {

    
    .wave-container svg {
        height: 150px;
    }
}

@media (max-width: 480px) {

    
    .wave-container svg {
        height: 120px;
    }
}
</style>
</head>

<body>
<!-- Top Wave Container -->
<div class="wave-container top">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path class="wave1"
            d="M0,192L60,202C120,213,240,235,360,224C480,213,600,171,720,160C840,149,960,171,1080,181C1200,192,1320,192,1380,192L1440,192L1440,320L0,320Z">
        </path>

        <path class="wave2"
            d="M0,160L60,170C120,180,240,200,360,190C480,180,600,140,720,130C840,120,960,140,1080,150C1200,160,1320,160,1380,160L1440,160L1440,320L0,320Z">
        </path>

        <path class="wave3"
            d="M0,220L60,210C120,200,240,190,360,200C480,210,600,250,720,240C840,230,960,190,1080,180C1200,170,1320,180,1380,185L1440,190L1440,320L0,320Z">
        </path>
    </svg>
</div>



<!-- Bottom Wave Container -->
<div class="wave-container bottom">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path class="wave1"
            d="M0,192L60,202C120,213,240,235,360,224C480,213,600,171,720,160C840,149,960,171,1080,181C1200,192,1320,192,1380,192L1440,192L1440,320L0,320Z">
        </path>

        <path class="wave2"
            d="M0,160L60,170C120,180,240,200,360,190C480,180,600,140,720,130C840,120,960,140,1080,150C1200,160,1320,160,1380,160L1440,160L1440,320L0,320Z">
        </path>

        <path class="wave3"
            d="M0,220L60,210C120,200,240,190,360,200C480,210,600,250,720,240C840,230,960,190,1080,180C1200,170,1320,180,1380,185L1440,190L1440,320L0,320Z">
        </path>
    </svg>
</div>

</body>
</html>
